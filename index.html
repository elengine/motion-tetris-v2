<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0e27" />
    <title>NEON TETRIS v2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="./icons/icon-192.png" />
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>

      <div id="hud" class="hud">
        <div class="stat hud-mini"><span class="hud-label">SCORE</span><span id="hud-score" class="hud-value">0</span></div>
        <div class="stat hud-mini"><span class="hud-label">LEVEL</span><span id="hud-level" class="hud-value">1</span></div>
        <div class="stat hud-mini"><span class="hud-label">LINES</span><span id="hud-lines" class="hud-value">0</span></div>
        <div class="stat hud-mini"><span class="hud-label">TIME</span><span id="hud-time" class="hud-value">00:00</span></div>
        <div class="stat hud-mini"><span class="hud-label">BEST</span><span id="hud-best" class="hud-value">-</span></div>
        <div class="btns">
          <button id="pause-btn" class="mini-btn" aria-label="一時停止"><svg viewBox="0 0 24 24" class="ic ic-main"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg><svg viewBox="0 0 24 24" class="ic ic-alt"><path d="M8 5l11 7-11 7z"/></svg></button>
          <button id="mute-btn" class="mini-btn" aria-label="音声切替"><svg viewBox="0 0 24 24" class="ic ic-main"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><svg viewBox="0 0 24 24" class="ic ic-alt"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        </div>
      </div>

      <div id="panels">
        <aside class="glass-card side-panel">
          <h3 class="panel-title">NEXT</h3>
          <canvas id="next-canvas" width="120" height="192"></canvas>
        </aside>
        <aside class="glass-card side-panel">
          <h3 class="panel-title">HOLD</h3>
          <canvas id="hold-canvas" width="120" height="64"></canvas>
        </aside>
      </div>

      <div id="touchpad">
        <button class="tc" data-action="left">◀</button>
        <button class="tc" data-action="rot-ccw">↺</button>
        <button class="tc" data-action="rot-cw">↻</button>
        <button class="tc" data-action="right">▶</button>
        <button class="tc" data-action="soft">▼</button>
        <button class="tc" data-action="drop">⇓</button>
        <button class="tc" data-action="hold">H</button>
      </div>

      <div id="overlay">
        <h1 id="ov-title" class="neon-title">NEON TETRIS</h1>
        <p id="ov-version" class="ov-version">v1.4.1</p>
        <p id="ov-sub"></p>
        <div id="ov-body"></div>
        <select id="mode-select" class="glass-card mode-select">
          <option value="marathon">マラソン</option>
          <option value="sprint">スプリント 40L</option>
          <option value="ultra">ウルトラ 2分</option>
        </select>
        <button id="ov-action" class="cta-btn">はじめる</button>
        <a class="v1-link" href="https://elengine.github.io/motion-tetris/" target="_blank" rel="noopener">旧バージョン (v1) でも遊ぶ →</a>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
